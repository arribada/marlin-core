syntax = "proto3";
package sat;
option go_package = "./pb";

message SysInit {
    string id = 1;
    string addr = 2;
    string sec_key = 3;
    string rconf = 4;
    string hostname = 5;
    string wifi_network = 6;
}

message SatMessage {
    string message = 1;
}

message CoreStatus {
    Status camera = 1;
    Status controller = 2;
    Status cloud_connection = 3;
    Status cellular = 4;
    Status wifi = 5;
    Status gps = 6;
    Status tailscale = 7;
    Status local_dash = 8;
    float storage_usage = 9;
    string tailscale_ip = 10;

    enum Status {
        ONLINE = 0;
		OFFLINE = 1;
		ERROR = 2;
        UNKNOWN = 3;
    }
}

message HarbourMode {
    Command cmd = 1;

    enum Command {
        ENTER = 0;
        EXIT = 1;
    }
}

message CoreMessage {
    uint32 msg_id = 1;
    oneof message {
        SatMessage sat = 2;
        SysInit init = 3;
        CoreStatus status = 4;
        HarbourMode mode = 5;
    }
}

message LpmReply {
    uint32 msg_id = 1;
    Response response = 2;

    enum Response {
        OK = 0;
        ERROR = 1;
    }
}
